[package]
name = "wry-bindgen"
version = "0.2.122"
edition = "2024"
description = "Native desktop implementation of wasm-bindgen APIs using wry"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DioxusLabs/wasm-bindgen-wry"

[features]
default = ["std"]
std = []
# `serde`/`serde_json` enable the optional deps used by
# `JsValue::{from,into}_serde`; the remaining feature names are no-op flags
# retained for workspace feature resolution.
enable-interning = ["std"]
serde-serialize = ["serde", "serde_json", "std"]
serde = ["dep:serde"]
serde_json = ["dep:serde_json"]
spans = []
strict-macro = []
gg-alloc = []
msrv = []
rustversion = []
xxx_debug_only_print_generated_code = []

[dependencies]
inventory = "0.3.21"
wry-bindgen-core = { path = "../wry-bindgen-core", version = "0.1.0" }
wry-bindgen-macro = { path = "../wry-bindgen-macro", version = "=0.2.122" }
wry-bindgen-runtime = { path = "../wry-bindgen-runtime", version = "0.1.0" }
# We use this instead of std because wasm bindgen supports no_std environments
cfg-if = "1.0.0"
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

[build-dependencies]
lazy-js-bundle = "0.7.2"

[lints]
workspace = true
