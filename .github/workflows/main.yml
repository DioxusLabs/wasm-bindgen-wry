name: Rust CI

on:
  push:
    branches:
      - main
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/**"

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-api-diff:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    name: Public API Diff
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-all-crates: "true"

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@9d36bebae244fb1a7fd7831d3c5a4bc8f1cab230 # main

      - name: Install cargo-semver-checks
        run: cargo binstall cargo-semver-checks -y --force --version 0.44.0

      - name: Run public API diff
        run: ./scripts/check-wasm-bindgen-api.rs

  fmt:
    if: github.event.pull_request.draft == false
    name: Rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    if: github.event.pull_request.draft == false
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: awalsh128/cache-apt-pkgs-action@2c09a5e66da6c8016428a2172bd76e5e4f14bb17
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
          version: 1.0
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-all-crates: "true"
      - run: cargo check --workspace --all-features

  wasm:
    if: github.event.pull_request.draft == false
    name: Wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-all-crates: "true"
      # The wasm-bindgen shim must still compile for the browser target, where it
      # delegates to the real upstream wasm-bindgen instead of wry-bindgen.
      - run: cargo check --manifest-path packages/wasm-bindgen/Cargo.toml --target wasm32-unknown-unknown
      # The sys shims must also compile for plain wasm32, where they build
      # against upstream's runtime API instead of the wry backend.
      - run: |
          cargo check --manifest-path packages/js-sys-x/Cargo.toml --target wasm32-unknown-unknown
          cargo check --manifest-path packages/wasm-bindgen-futures-x/Cargo.toml --target wasm32-unknown-unknown
          cargo check --manifest-path packages/web-sys-x/Cargo.toml --features console,Window --target wasm32-unknown-unknown
          cargo check --manifest-path vendored/wasm-bindgen/crates/test/Cargo.toml --target wasm32-unknown-unknown
      - name: Run wasm-bindgen on linked sys shim fixture
        run: ./scripts/check-wasm-bindgen-linked-sys-shims.sh

  clippy:
    if: github.event.pull_request.draft == false
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: awalsh128/cache-apt-pkgs-action@2c09a5e66da6c8016428a2172bd76e5e4f14bb17
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
          version: 1.0
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-all-crates: "true"
      # Workspace lints in Cargo.toml handle denying warnings for our code
      - run: cargo clippy --workspace --all-features

  docs:
    if: github.event.pull_request.draft == false
    name: Docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: awalsh128/cache-apt-pkgs-action@2c09a5e66da6c8016428a2172bd76e5e4f14bb17
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
          version: 1.0
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-all-crates: "true"
      # Only document workspace members, not vendored wasm-bindgen packages.
      # `wasm-bindgen` is documented by manifest path: the wasm32 build pulls a
      # second crate also named `wasm-bindgen` (the real upstream), so a bare
      # `-p wasm-bindgen` is ambiguous.
      - run: |
          cargo doc --no-deps --all-features -p wry-launch -p wry-bindgen-macro -p wry-bindgen-macro-support
          cargo doc --no-deps --all-features --manifest-path packages/wasm-bindgen/Cargo.toml
        env:
          RUSTDOCFLAGS: -Dwarnings

  test:
    if: github.event.pull_request.draft == false
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Linux dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@2c09a5e66da6c8016428a2172bd76e5e4f14bb17
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libxkbcommon-x11-dev xvfb
          version: 1.0

      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-all-crates: "true"

      # Run tests with xvfb on Linux (headless webview needs a display)
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run cargo test --workspace

      # Run tests on macOS and Windows
      - name: Run tests (macOS/Windows)
        if: runner.os != 'Linux'
        run: cargo test --workspace

  wasm-bindgen-compat:
    if: github.event.pull_request.draft == false
    name: wasm-bindgen compat (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # WB_SHARD_TOTAL below must equal the number of shards listed here.
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: awalsh128/cache-apt-pkgs-action@2c09a5e66da6c8016428a2172bd76e5e4f14bb17
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
          version: 1.0
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-all-crates: "true"
          key: compat-shard-${{ matrix.shard }}
      # Build the hardcoded top-100 wasm-bindgen dependents against the shim to
      # catch macro/runtime API drift. Native-exercising crates build for the
      # host; wasm32-gated crates build for wasm32 via unstable_force_wry_backend.
      # Sharded across runners; each shard builds its slice of the crate list.
      - name: Build top wasm-bindgen dependents against the shim
        env:
          WB_SHARD_TOTAL: "4"
          WB_SHARD_INDEX: ${{ matrix.shard }}
        run: ./scripts/check-wasm-bindgen-compat.sh
