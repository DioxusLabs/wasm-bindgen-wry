[package]
name = "web-sys-x"
version = "0.3.99"
edition = "2021"
description = "Target-switching shim for web-sys and web-sys-wry"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DioxusLabs/wasm-bindgen-wry"
rust-version = "1.77"
readme = "./README.md"

[lib]
name = "web_sys"
doctest = false
test = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys-upstream = { package = "web-sys", version = "=0.3.99", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
web-sys-wry = { package = "web-sys-wry", path = "../../vendored/wasm-bindgen/crates/web-sys", version = "=0.3.99", default-features = false }

[features]
default = ["std"]
std = ["web-sys-upstream/std", "web-sys-wry/std"]
AbortController = ["web-sys-upstream/AbortController", "web-sys-wry/AbortController"]
