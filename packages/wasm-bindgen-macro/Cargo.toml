[package]
name = "wasm-bindgen-macro"
version = "0.2.123"
edition = "2024"
description = "Shim macro that expands to both wasm-bindgen and wry-bindgen implementations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DioxusLabs/wasm-bindgen-wry"

[lib]
proc-macro = true

[features]
# Emit the wry-bindgen expansion on every target, including wasm32, instead of
# delegating to upstream wasm-bindgen there. Driven by the wasm-bindgen shim's
# feature of the same name so wasm32-gated dependents can be compiled against the
# wry backend (compat testing). Unstable: no stability guarantees.
unstable_force_wry_backend = []

[dependencies]
wry-bindgen-macro-support = { path = "../wry-bindgen-macro-support", version = "=0.2.123" }
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[lints]
workspace = true
