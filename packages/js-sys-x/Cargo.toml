[package]
name = "js-sys-x"
version = "0.3.99"
edition = "2021"
description = "Target-switching shim for js-sys and js-sys-wry"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DioxusLabs/wasm-bindgen-wry"
rust-version = "1.77"
readme = "./README.md"

[lib]
name = "js_sys"
doctest = false
test = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys-upstream = { package = "js-sys", version = "=0.3.99", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
js-sys-wry = { package = "js-sys-wry", path = "../../vendored/wasm-bindgen/crates/js-sys", version = "=0.3.99", default-features = false }

[features]
default = ["std", "unsafe-eval"]
std = ["js-sys-upstream/std", "js-sys-wry/std"]
unsafe-eval = ["js-sys-upstream/unsafe-eval", "js-sys-wry/unsafe-eval"]
futures-core-03-stream = ["js-sys-upstream/futures-core-03-stream", "js-sys-wry/futures-core-03-stream"]

[lints]
workspace = true
