[package]
name = "wry-launch"
version = "0.1.0"
# Edition 2021 so the vendored upstream `tests/wasm/*.rs` files compile when
# pulled in unmodified via `#[path]`: some of them use edition-2021 attribute
# syntax (e.g. a bare `#[no_mangle]`) that edition 2024 rejects.
edition = "2021"

[dependencies]
base64 = "0.22.1"
bytemuck = "1.24.0"
inventory = "0.3.21"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tao = "0.34"
wry = { version = "0.53.5", features = ["devtools"] }
wasm-bindgen = { path = "../wasm-bindgen", package = "wasm-bindgen" }
wry-bindgen-runtime = { path = "../wry-bindgen-runtime" }
futures-util = "0.3.31"
tokio = { version = "1.48.0", features = ["full"] }

[target."cfg(any(target_os = \"linux\", target_os = \"dragonfly\", target_os = \"freebsd\", target_os = \"openbsd\", target_os = \"netbsd\"))".dependencies]
gtk = "0.18"

[build-dependencies]
lazy-js-bundle = { git = "https://github.com/DioxusLabs/dioxus" }

[dev-dependencies]
web-sys = { version = "=0.3.99", features = ["CssStyleDeclaration", "Element", "HtmlElement", "Window", "CanvasRenderingContext2d", "Document", "HtmlCanvasElement", "Event", "MouseEvent"] }
wasm-bindgen-futures = "=0.4.72"
js-sys = "=0.3.99"
futures-channel = "0.3.31"
rand = "0.9.2"
libtest-mimic = "0.8"
criterion = "0.5.1"
paste = "1.0.15"
wasm-bindgen-test = { path = "../wasm-bindgen-test" }
wasm-bindgen-test-crate-a = { path = "../wasm-bindgen/tests/crates/a" }
wasm-bindgen-test-crate-b = { path = "../wasm-bindgen/tests/crates/b" }

[[test]]
name = "main_thread_tests"
path = "tests/main_thread_tests/main.rs"
harness = false

[[test]]
name = "upstream_tests"
path = "tests/upstream_tests/main.rs"
harness = false

[[bench]]
name = "main_thread_benches"
path = "benches/main.rs"
harness = false

[[example]]
name = "canvas"
path = "examples/canvas.rs"

[[example]]
name = "dom"
path = "examples/dom.rs"

[[example]]
name = "paint"
path = "examples/paint.rs"

[lints]
workspace = true
